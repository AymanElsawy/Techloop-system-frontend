<div class="space-y-3">
  <div>
    <div class="flex items-baseline justify-between">
      <label for="supplier" class="form-label">المورد{{ required() ? ' *' : '' }}</label>
      @if (!showForm()) {
        <button type="button" class="text-sm font-semibold text-vibrant-coral-400 hover:underline" (click)="showForm.set(true)">+ مورد جديد</button>
      }
    </div>
    <select id="supplier" [formControl]="control()" class="form-input">
      <option value="" [disabled]="required()">{{ required() ? 'اختر المورد' : 'بدون' }}</option>
      @for (s of suppliers.value() ?? []; track s.id) {
        <option [value]="s.id">{{ s.name }}{{ s.phone ? ' — ' + s.phone : '' }}</option>
      }
    </select>
    @if (suppliers.error()) {
      <p role="alert" class="form-error">
        تعذر تحميل الموردين.
        <button type="button" class="underline" (click)="suppliers.reload()">إعادة المحاولة</button>
      </p>
    }
  </div>

  @if (showForm()) {
    <div class="rounded-lg border border-stormy-teal-800 bg-alabaster-grey-800 p-4" [formGroup]="form">
      <p class="mb-3 text-sm font-semibold">مورد جديد</p>
      <div class="grid gap-3 sm:grid-cols-3 sm:items-end">
        <div>
          <label for="new-supplier-name" class="form-label">الاسم *</label>
          <input id="new-supplier-name" formControlName="name" class="form-input" />
        </div>
        <div>
          <label for="new-supplier-phone" class="form-label">الهاتف</label>
          <input id="new-supplier-phone" formControlName="phone" class="form-input" dir="ltr" inputmode="tel" />
        </div>
        <div class="flex gap-2">
          <button type="button" class="btn-primary" [disabled]="form.invalid || saving()" (click)="add()">إضافة</button>
          <button type="button" class="btn-outline" (click)="showForm.set(false)">إلغاء</button>
        </div>
      </div>
      @if (error()) {
        <p role="alert" class="form-error">{{ error() }}</p>
      }
    </div>
  }
</div>
